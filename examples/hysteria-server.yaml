# 新服务器专用模板。先替换本节点的口令，再启用服务。
# 东京使用 443/UDP；新加坡将本行改为 "0.0.0.0:8443"。
listen: "0.0.0.0:443"
tls:
  cert: /etc/hysteria/tls/server.crt
  key: /etc/hysteria/tls/server.key
auth:
  type: password
  password: "REPLACE_WITH_NODE_PASSWORD"

# 限制代理只能对外访问公网 IPv4，保护云元数据、环回和内网目标。
acl:
  inline:
    - reject(0.0.0.0/8)
    - reject(10.0.0.0/8)
    - reject(100.64.0.0/10)
    - reject(127.0.0.0/8)
    - reject(169.254.0.0/16)
    - reject(172.16.0.0/12)
    - reject(192.168.0.0/16)
    - reject(198.18.0.0/15)
    - reject(224.0.0.0/4)
    - reject(240.0.0.0/4)
    - reject(::1/128)
    - reject(fc00::/7)
    - reject(fe80::/10)
    - reject(ff00::/8)
    - direct(all)
outbounds:
  - name: direct
    type: direct
    direct:
      mode: "4"
